<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article | WildBridge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend:wght@500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Lexend', sans-serif; }
        .bg-nature { background-image: linear-gradient(rgba(240, 244, 240, 0.75), rgba(240, 244, 240, 0.75)), url('assets/termsbg.jpg'); background-size: cover; background-position: center; background-attachment: fixed; }
        .text-forest { color: #2d4a22; }
        .bg-forest { background-color: #2d4a22; }

        /* Markdown generated styles */
        #article-body h2 { font-size: 1.75rem; font-weight: 800; color: #2d4a22; margin-top: 2rem; margin-bottom: 1rem; }
        #article-body h3 { font-size: 1.25rem; font-weight: 700; color: #2d4a22; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        #article-body p { margin-bottom: 1.25rem; line-height: 1.75; }
        #article-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        #article-body li { margin-bottom: 0.5rem; }
        #article-body blockquote { border-left: 4px solid #2d4a22; padding-left: 1.5rem; margin: 1.5rem 0; font-style: italic; color: #4b5563; background-color: rgba(240, 244, 240, 0.5); padding: 1rem; border-radius: 0 0.75rem 0.75rem 0; }
    </style>
</head>
<body class="bg-nature text-gray-800">
    <!-- Navigation -->
    <nav class="p-6">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-800 text-forest font-display tracking-tight">WildBridge</a>
            <div class="flex gap-6">
                <a href="index.html" class="text-forest hover:underline font-medium">Home</a>
                <a href="about.html" class="text-forest hover:underline font-medium">About</a>
                <a href="blog.html" class="text-forest hover:underline font-medium">Blog</a>
                <a href="contact.html" class="text-forest hover:underline font-medium">Contact/Delete Account</a>
            </div>
        </div>
    </nav>

    <!-- Main Article Container -->
    <main class="container mx-auto px-6 py-12 max-w-3xl">
        <!-- Back to Blog -->
        <div class="mb-8">
            <a href="blog.html" class="inline-flex items-center text-forest font-bold hover:underline text-sm">
                &larr; Back to Blog
            </a>
        </div>

        <article class="bg-white p-8 md:p-12 rounded-3xl shadow-sm space-y-8">
            <!-- Article Header -->
            <header class="space-y-4 border-b border-gray-100 pb-8">
                <div class="flex items-center gap-4 text-sm text-gray-500">
                    <span id="article-category" class="bg-nature text-forest font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">Category</span>
                    <span id="article-date">November 22, 2026</span>
                </div>
                <h1 id="article-title" class="text-3xl md:text-4xl font-800 text-forest leading-tight">
                    Loading Article...
                </h1>
                <div class="flex items-center gap-3 pt-2">
                    <div class="w-10 h-10 rounded-full bg-forest text-white font-bold flex items-center justify-center text-sm" id="author-initials">WB</div>
                    <div>
                        <p id="article-author" class="font-bold text-forest text-sm">WildBridge Team</p>
                        <p class="text-xs text-gray-400">WildBridge & WildKin Conservation</p>
                    </div>
                </div>
            </header>

            <!-- Featured Image Container (Conditionally Shown/Hidden) -->
            <div id="article-image-container" class="rounded-2xl overflow-hidden bg-gray-100 h-64 md:h-80 flex items-center justify-center text-gray-400 hidden">
                <img id="article-image" src="" alt="" class="w-full h-full object-cover">
            </div>

            <!-- Article Body Content (Rendered via Markdown) -->
            <div id="article-body" class="text-gray-700 leading-relaxed text-lg">
                Loading content...
            </div>
        </article>
    </main>

    <!-- Footer -->
    <footer class="py-12 text-center text-gray-500">
        <p>&copy; 2026 WildBridge. <a href="terms.html" class="underline">Terms</a> | <a href="privacy.html" class="underline">Privacy</a></p>
    </footer>

    <script>
        // Fallback data in case fetch() is blocked by browser CORS policy on file:// protocol
        const embeddedArticles = {
            "articles": [
                {
                    "id": "welcome-to-wildkin",
                    "category": "Welcome",
                    "date": "November 22, 2026",
                    "title": "Welcome to the WildBridge & WildKin Blog!",
                    "author": "WildBridge Team",
                    "authorInitials": "WB",
                    "image": null,
                    "summary": "We are thrilled to launch our official blog! Here, you'll find exciting updates on WildKin development...",
                    "content": "We are thrilled to launch our official blog! Here, you'll find exciting updates on WildKin development, fascinating deep-dives into the behavior and ecology of Southern California's native wildlife, and step-by-step tutorials to help you build the ultimate virtual sanctuary for your animal companions.\n\n## Introduction & Mission\n\nConservation begins with understanding and connection. Through our interactive virtual world, players can adopt virtual wildlife companions inspired by real Southern California species, care for them, explore their natural habitats, and discover fascinating facts about the environment.\n\n## What to Expect on This Blog\n\nIn upcoming posts, we will dive deeper into several key areas:\n\n- **Game Updates:** Patch notes, new biomes, habitat decorations, and feature previews.\n- **Wildlife Facts:** Educational spotlights on native species like mountain lions, bobcats, Anna's hummingbirds, and more.\n- **Tutorials & Guides:** Tips and tricks for mastering minigames, maximizing resource gathering, and completing journal entries.\n\n> \"By helping people better understand wildlife, we can encourage greater appreciation for the animals, habitats, and ecosystems that make our world so extraordinary.\"\n\n## Join Our Journey\n\nStay tuned as we share stories from our conservation journey, collaborate with community members, and continue creating innovative ways to inspire the next generation of wildlife enthusiasts. Thank you for being part of WildBridge!"
                }
            ]
        };

        async function loadMarkdownArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id') || 'welcome-to-wildkin';

            let data;
            try {
                const response = await fetch('articles.md');
                if (!response.ok) throw new Error('Network response was not ok');
                data = await response.json();
            } catch (error) {
                console.warn('Fetch failed (likely due to file:// CORS restriction). Using embedded article data as fallback.', error);
                data = embeddedArticles;
            }

            const article = data.articles.find(a => a.id === articleId);

            if (!article) {
                document.getElementById('article-title').innerText = "Article Not Found";
                document.getElementById('article-body').innerText = "The requested article could not be found.";
                return;
            }

            document.title = `${article.title} | WildBridge`;
            document.getElementById('article-category').innerText = article.category;
            document.getElementById('article-date').innerText = article.date;
            document.getElementById('article-title').innerText = article.title;
            document.getElementById('article-author').innerText = article.author;
            document.getElementById('author-initials').innerText = article.authorInitials;

            // Handle optional image display
            const imageContainer = document.getElementById('article-image-container');
            const articleImg = document.getElementById('article-image');
            if (article.image) {
                articleImg.src = article.image;
                articleImg.alt = article.title;
                imageContainer.classList.remove('hidden');
            } else {
                imageContainer.classList.add('hidden');
            }

            // Parse Markdown content using marked.js
            document.getElementById('article-body').innerHTML = marked.parse(article.content);
        }

        loadMarkdownArticle();
    </script>
</body>
</html>
